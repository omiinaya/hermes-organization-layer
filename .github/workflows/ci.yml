name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (self-hosted, Python 3.13)
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4

      # Self-hosted runner (LXC 100 / pve-scripts-local) uses a provisioned venv
      # (/opt/org-ci-venv, Python 3.13 + pytest) instead of setup-python.
      - name: Python environment
        run: /opt/org-ci-venv/bin/python --version && /opt/org-ci-venv/bin/python -m pytest --version

      - name: Run the orgcore test suite
        run: /opt/org-ci-venv/bin/python -m pytest tests/ -q

      - name: Verify register() exposes the full tool surface
        run: |
          cd plugin
          /opt/org-ci-venv/bin/python - <<'EOF'
          import sys; sys.path.insert(0,"."); import plugin as P
          class Ctx:
              def __init__(s): s.cmds=[]; s.tools=[]
              def register_command(s,n,**k): s.cmds.append(n)
              def register_tool(s,**k): s.tools.append(k["name"])
          c=Ctx(); P.register(c)
          assert c.cmds==["org"] and len(c.tools)>=13, (c.cmds, len(c.tools))
          print("register OK:", len(c.tools), "tools")
          EOF

      - name: Privacy invariant (no absolute paths in index artifacts)
        run: |
          /opt/org-ci-venv/bin/python - <<'EOF'
          import json, os, sys, tempfile
          from pathlib import Path
          repo = Path.cwd()
          with tempfile.TemporaryDirectory(prefix="ci-org-") as td:
              os.environ["HERMES_ORG_WORKSPACE"] = td
              os.environ["HERMES_HOME"] = str(Path(td) / ".hermes")
              sys.path.insert(0, str(repo / "plugin"))
              from orgcore import actions
              actions.cmd_init()
              actions.cmd_new("projects", "demo", "CI smoke", tags=["ci"])
              md = (Path(td) / "INDEX.md").read_text()
              jd = json.loads((Path(td) / "index.json").read_text())
              assert td not in md and td not in json.dumps(jd), "absolute path leaked"
              assert jd["privacy"] == "strict" and jd["workspace"] == Path(td).name
              assert not jd["items"][0]["rel_path"].startswith(("/", "C:", "D:"))
          print("privacy invariant OK")
          EOF