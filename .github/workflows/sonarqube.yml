name: SonarQube Analysis (reusable)

# Called from per-repo workflows via:
#   uses: omiinaya/hermes-organization-layer/.github/workflows/sonarqube.yml@main
# Runs ONLY on the self-hosted runner (label pve-scripts) so it can reach the
# LAN-internal SonarQube server. Requires the repo to expose a SONAR_TOKEN secret
# (minted on SonarQube) so the self-hosted runner can publish analysis.
#
# SonarQube server: http://192.168.1.130:9000  (deployed via community-scripts,
# CT 104, static IP, vault creds) — keep LAN-internal per doctrine.

on:
  workflow_call:
    inputs:
      main_branch:
        description: Main branch to compare against
        required: false
        type: string
        default: main
      java_version:
        description: JDK major version for sonar-scanner
        required: false
        type: number
        default: 21
    secrets:
      SONAR_TOKEN:
        required: true
        description: Analysis token minted on SonarQube

jobs:
  sonarqube:
    name: SonarQube analysis
    runs-on: [self-hosted, linux, x64, pve-scripts]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Install sonar-scanner
        run: |
          set -eux
          curl -fsSL -o /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip"
          mkdir -p /tmp/sonar-scanner
          unzip -q -o /tmp/sonar-scanner.zip -d /tmp/sonar-scanner
          SONAR_DIR=$(find /tmp/sonar-scanner -maxdepth 1 -type d -name 'sonar-scanner-*' | head -1)
          echo "SONAR_SCANNER_HOME=$SONAR_DIR" >> "$GITHUB_ENV"
          "$SONAR_DIR/bin/sonar-scanner" --version

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://192.168.1.130:9000"
        run: |
          "$SONAR_SCANNER_HOME/bin/sonar-scanner" \
            -Dsonar.projectKey="${{ github.event.repository.name }}" \
            -Dsonar.projectName="${{ github.event.repository.name }}" \
            -Dsonar.projectVersion="${{ github.sha }}" \
            -Dsonar.sources=. \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.scm.provider=git \
            -Dsonar.branch.name="${{ github.ref_name }}"